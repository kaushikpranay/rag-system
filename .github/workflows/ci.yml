name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/000000000000/fake
          S3_BUCKET_NAME: fake-bucket
          DYNAMODB_TABLE: fake-table
          DASHBOARD_PASSWORD_HASH: fake-/rag-system/DASHBOARD_PASSWORD_HASH
          GROQ_API_KEY: fake-groq-api-key
          RDS_PASSWORD: fake-rds-password
        run: python -m pytest tests/
