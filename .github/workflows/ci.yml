name: CI
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Start SSH tunnel to RDS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_BASTION_HOST: ${{ secrets.SSH_BASTION_HOST }}
          RDS_HOST: rag-postgres.ce1uqqk8ey5g.us-east-1.rds.amazonaws.com
        run: |
          if [ -n "$SSH_PRIVATE_KEY" ] && [ -n "$SSH_BASTION_HOST" ]; then
            mkdir -p ~/.ssh
            echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
            chmod 600 ~/.ssh/id_rsa
            BASTION="$SSH_BASTION_HOST"
            if [[ "$BASTION" != *"@"* ]]; then
              BASTION="ec2-user@$BASTION"
            fi
            ssh -o StrictHostKeyChecking=no -f -N -L 15432:$RDS_HOST:5432 $BASTION
          fi

      - name: Run tests
        env:
          AWS_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || 'testing' }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || 'testing' }}
          SQS_QUEUE_URL: https://sqs.us-east-1.amazonaws.com/961546607247/rag-escalation-queue
          S3_BUCKET_NAME: rag-system-kaushik-pranay
          DYNAMODB_TABLE: rag-session-memory
          DASHBOARD_PASSWORD_HASH: c35aa6069fd4489ca784a6f2e82c9099287f9abe22f17e5a194940c43e983633
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RDS_HOST: rag-postgres.ce1uqqk8ey5g.us-east-1.rds.amazonaws.com
          RDS_PORT: 5432
          RDS_DB: ragdb
          RDS_USER: ragadmin
          RDS_PASSWORD: ${{ secrets.RDS_PASSWORD }}
        run: python -m pytest tests/ -m "not integration"
