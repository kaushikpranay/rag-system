<!--Chat.html-->

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Query System</title>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0d0f18;
            color: #e2e4f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 32px 16px 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }

        .header h1 {
            font-size: 1.6rem;
            font-weight: 600;
            color: #7c83fd;
            letter-spacing: -0.3px;
            margin-bottom: 6px;
        }

        .header p {
            color: #5a5f7a;
            font-size: 0.85rem;
        }

        .chat-wrapper {
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
        }

        #chat-box {
            display: flex;
            flex-direction: column;
            gap: 12px;
            height: 58vh;
            overflow-y: auto;
            padding: 20px 16px;
            background: #12151f;
            border: 1px solid #1e2235;
            border-radius: 14px 14px 0 0;
            scroll-behavior: smooth;
        }

        #chat-box::-webkit-scrollbar {
            width: 5px;
        }

        #chat-box::-webkit-scrollbar-track {
            background: transparent;
        }

        #chat-box::-webkit-scrollbar-thumb {
            background: #2a2f4a;
            border-radius: 10px;
        }

        .msg {
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            font-size: 0.875rem;
            line-height: 1.65;
            word-break: break-word;
        }

        .msg.user {
            background: #1c2040;
            border: 1px solid #272d52;
            color: #b8bcf0;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .msg.bot {
            background: #161a2c;
            border: 1px solid #1e2440;
            color: #dde0f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .msg.bot.escalated {
            background: #1c180c;
            border: 1px solid #3a2e0a;
            border-left: 3px solid #f0a500;
            color: #f0d080;
        }

        .confidence {
            font-size: 0.7rem;
            color: #444860;
            margin-top: 6px;
        }

        .msg.bot.escalated .confidence {
            color: #7a6030;
        }

        .status-msg {
            font-size: 0.8rem;
            color: #d4900a;
            align-self: flex-start;
            padding: 8px 14px;
            background: #1c180c;
            border-radius: 8px;
            border: 1px solid #3a2e0a;
            max-width: 90%;
        }

        .resolved-msg {
            font-size: 0.8rem;
            color: #3db87a;
            align-self: flex-start;
            padding: 8px 14px;
            background: #0c1a12;
            border-radius: 8px;
            border: 1px solid #1a3d28;
            max-width: 90%;
        }

        .input-bar {
            display: flex;
            background: #161a2c;
            border: 1px solid #1e2440;
            border-top: none;
            border-radius: 0 0 14px 14px;
            padding: 12px;
            gap: 10px;
            align-items: center;
        }

        #query-input {
            flex: 1;
            background: #1c2040;
            border: 1px solid #272d52;
            border-radius: 9px;
            color: #e2e4f0;
            font-family: inherit;
            font-size: 0.875rem;
            padding: 10px 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        #query-input::placeholder {
            color: #3a3f60;
        }

        #query-input:focus {
            border-color: #7c83fd;
        }

        #send-btn {
            background: #7c83fd;
            color: #fff;
            border: none;
            border-radius: 9px;
            padding: 10px 22px;
            font-family: inherit;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        #send-btn:hover {
            background: #6970e8;
        }

        #send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid #2a2f4a;
            border-top-color: #7c83fd;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        #ask-human-btn {
            position: fixed;
            right: 0;
            top: 50%;
            transform: translateY(-50%);
            background: #4f46e5;
            color: #fff;
            border: none;
            padding: 16px 9px;
            border-radius: 10px 0 0 10px;
            cursor: pointer;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.8px;
            z-index: 200;
            box-shadow: -3px 0 16px rgba(79, 70, 229, 0.35);
            transition: background 0.2s;
        }

        #ask-human-btn:hover {
            background: #5d55f0;
        }

        #escalate-panel {
            position: fixed;
            right: -320px;
            top: 50%;
            transform: translateY(-50%);
            background: #12151f;
            border: 1px solid #1e2235;
            border-right: none;
            border-radius: 14px 0 0 14px;
            padding: 22px 18px;
            width: 300px;
            max-height: 72vh;
            overflow-y: auto;
            z-index: 199;
            box-shadow: -6px 0 32px rgba(0, 0, 0, 0.5);
            transition: right 0.3s ease;
        }

        #escalate-panel.open {
            right: 0;
        }

        .panel-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #7c83fd;
            margin-bottom: 3px;
        }

        .panel-sub {
            font-size: 0.75rem;
            color: #3a3f60;
            margin-bottom: 14px;
        }

        .panel-divider {
            border: none;
            border-top: 1px solid #1e2235;
            margin-bottom: 14px;
        }

        #query-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 16px;
        }

        .query-item {
            padding: 10px 12px;
            border: 1px solid #1e2235;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8rem;
            color: #9aa0d0;
            background: #161a2c;
            line-height: 1.4;
            transition: border-color 0.15s, background 0.15s;
        }

        .query-item:hover {
            border-color: #4f46e5;
            background: #1a1e30;
        }

        .query-item.selected {
            border-color: #7c83fd;
            background: #1c2040;
            color: #c8ccf8;
        }

        .panel-empty {
            font-size: 0.8rem;
            color: #2e3355;
            text-align: center;
            padding: 24px 0;
        }

        .panel-btn {
            width: 100%;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 8px;
            transition: opacity 0.2s, background 0.2s;
        }

        .panel-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .panel-btn.primary {
            background: #4f46e5;
            color: #fff;
        }

        .panel-btn.primary:hover:not(:disabled) {
            background: #5d55f0;
        }

        .panel-btn.secondary {
            background: #1c2040;
            color: #5a5f7a;
            border: 1px solid #1e2235;
        }

        .panel-btn.secondary:hover {
            background: #1e2440;
        }
    </style>
</head>

<body>

    <div class="header">
        <h1>🔍 RAG Query System</h1>
        <p>Ask anything. Powered by AWS Bedrock + LangGraph.</p>
    </div>

    <div class="chat-wrapper">
        <div id="chat-box"></div>
        <div class="input-bar">
            <input id="query-input" type="text" placeholder="Ask a question..." maxlength="1000" />
            <button id="send-btn" onclick="sendQuery()">Send</button>
        </div>
    </div>

    <button id="ask-human-btn" onclick="togglePanel()">🙋 Ask Human</button>

    <div id="escalate-panel">
        <p class="panel-title">Ask a Human Expert</p>
        <p class="panel-sub">Select a question to send to an agent.</p>
        <hr class="panel-divider">
        <div id="query-list">
            <p class="panel-empty">No questions yet.</p>
        </div>
        <button class="panel-btn primary" id="panel-send-btn" onclick="sendSelectedToHuman()">Send to Human</button>
        <button class="panel-btn secondary" onclick="togglePanel()">Cancel</button>
    </div>

    <script>
        var chatBox = document.getElementById('chat-box');
        var currentSessionId = crypto.randomUUID();
        var pollingInterval = null;
        var chatHistory = [];
        var selectedQuery = null;

        function scrollDown() {
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function safe(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
        }

        function addMsg(html, type, extra) {
            var d = document.createElement('div');
            d.className = 'msg ' + type + (extra ? ' ' + extra : '');
            d.innerHTML = html;
            chatBox.appendChild(d);
            scrollDown();
            return d;
        }

        function addStatus(text, cls) {
            var d = document.createElement('div');
            d.className = cls || 'status-msg';
            d.textContent = text;
            chatBox.appendChild(d);
            scrollDown();
        }

        async function sendQuery() {
            var inp = document.getElementById('query-input');
            var btn = document.getElementById('send-btn');
            var query = inp.value.trim();
            if (!query) return;

            chatHistory.push(query);
            addMsg(safe(query), 'user');
            inp.value = '';
            btn.disabled = true;

            var loading = addMsg('<span class="spinner"></span> Thinking...', 'bot');

            try {
                var res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: query, session_id: currentSessionId })
                });
                var data = await res.json();
                var ans = safe(data.answer || 'No response.');

                if (data.escalated) {
                    loading.className = 'msg bot escalated';
                    loading.innerHTML = ans + '<div class="confidence">Confidence: ' + data.confidence + ' &nbsp;&middot;&nbsp; Auto-escalated ✓</div>';
                    startPolling();
                } else {
                    loading.innerHTML = ans + '<div class="confidence">Confidence: ' + data.confidence + '</div>';
                }
                scrollDown();
            } catch (e) {
                loading.className = 'msg bot';
                loading.textContent = 'Error connecting to server. Try again.';
            }

            btn.disabled = false;
        }

        function togglePanel() {
            var panel = document.getElementById('escalate-panel');
            var isOpen = panel.classList.contains('open');

            if (!isOpen) {
                var list = document.getElementById('query-list');
                list.innerHTML = '';
                selectedQuery = null;

                if (chatHistory.length === 0) {
                    list.innerHTML = '<p class="panel-empty">No questions yet.</p>';
                } else {
                    chatHistory.forEach(function (q) {
                        var d = document.createElement('div');
                        d.className = 'query-item';
                        d.textContent = q;
                        d.onclick = function () {
                            document.querySelectorAll('.query-item').forEach(function (el) {
                                el.classList.remove('selected');
                            });
                            d.classList.add('selected');
                            selectedQuery = q;
                        };
                        list.appendChild(d);
                    });
                }
            }
            panel.classList.toggle('open');
        }

        async function sendSelectedToHuman() {
            if (!selectedQuery) { alert('Please select a question first.'); return; }
            var btn = document.getElementById('panel-send-btn');
            btn.disabled = true;
            btn.textContent = 'Sending...';

            try {
                var res = await fetch('/escalate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query: selectedQuery, session_id: currentSessionId })
                });
                var data = await res.json();
                if (data.escalated) {
                    var q = selectedQuery;
                    togglePanel();
                    addStatus('⏳ "' + q + '" sent to human agent. Ask me again in ~1 minute.');
                    startPolling();
                    selectedQuery = null;
                }
            } catch (e) {
                alert('Failed to send. Try again.');
            }

            btn.disabled = false;
            btn.textContent = 'Send to Human';
        }

        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(async function () {
                try {
                    var res = await fetch('/queue-status/' + currentSessionId);
                    var data = await res.json();
                    if (!data.in_queue && data.answer) {
                        clearInterval(pollingInterval);
                        pollingInterval = null;
                        addStatus('✅ Human agent answered: ' + safe(data.answer), 'resolved-msg');
                    }
                } catch (e) { }
            }, 5000);
        }

        document.getElementById('query-input').addEventListener('keydown', function (e) {
            if (e.key === 'Enter') sendQuery();
        });
    </script>
</body>

</html>
