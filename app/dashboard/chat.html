<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAG Query System</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background: #0f1117;
            color: #e0e0e0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 1.8rem;
            color: #7c83fd;
            margin-bottom: 8px;
        }

        p.subtitle {
            color: #888;
            font-size: 0.9rem;
            margin-bottom: 32px;
        }

        #chat-box {
            width: 100%;
            max-width: 720px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            padding: 14px 18px;
            border-radius: 12px;
            max-width: 85%;
            line-height: 1.6;
            font-size: 0.95rem;
        }

        .user {
            background: #1e2130;
            align-self: flex-end;
            border: 1px solid #2e3250;
            color: #c0c8ff;
        }

        .bot {
            background: #161b2e;
            align-self: flex-start;
            border: 1px solid #2a3060;
            color: #e0e0e0;
        }

        .status-msg {
            font-size: 0.85rem;
            color: #f0a500;
            align-self: flex-start;
            padding: 8px 14px;
            background: #1e1a10;
            border-radius: 8px;
            border: 1px solid #f0a50033;
        }

        .resolved-msg {
            font-size: 0.85rem;
            color: #4caf82;
            align-self: flex-start;
            padding: 8px 14px;
            background: #0e1e17;
            border-radius: 8px;
            border: 1px solid #4caf8233;
        }

        .confidence {
            font-size: 0.75rem;
            color: #666;
            margin-top: 6px;
        }

        .btn-row {
            display: flex;
            gap: 10px;
            margin-top: 4px;
        }

        button {
            padding: 8px 18px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 600;
            transition: opacity 0.2s;
        }

        button:hover {
            opacity: 0.85;
        }

        #escalate-btn {
            background: #f0a500;
            color: #000;
        }

        #ask-again-btn {
            background: #7c83fd;
            color: #fff;
            display: none;
        }

        #input-row {
            display: flex;
            width: 100%;
            max-width: 720px;
            gap: 10px;
            margin-top: 16px;
        }

        #query-input {
            flex: 1;
            padding: 14px 18px;
            border-radius: 10px;
            border: 1px solid #2e3250;
            background: #1a1f35;
            color: #e0e0e0;
            font-size: 0.95rem;
            outline: none;
        }

        #query-input:focus {
            border-color: #7c83fd;
        }

        #send-btn {
            background: #7c83fd;
            color: #fff;
            padding: 14px 24px;
            border-radius: 10px;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 3px solid #333;
            border-top: 3px solid #7c83fd;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <h1>🔍 RAG Query System</h1>
    <p class="subtitle">Ask anything. Powered by AWS Bedrock + LangGraph.</p>

    <div id="chat-box"></div>

    <div id="input-row">
        <input id="query-input" type="text" placeholder="Ask a question..." maxlength="1000" />
        <button id="send-btn" onclick="sendQuery()">Send</button>
    </div>

    <script>
        const chatBox = document.getElementById('chat-box');
        let currentSessionId = crypto.randomUUID();
        let pollingInterval = null;
        let lastQuery = '';
        let lastAnswer = '';

        function addMessage(text, type) {
            const div = document.createElement('div');
            div.className = `message ${type}`;
            div.innerHTML = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        function addStatus(text, type = 'status-msg') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = text;
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
            return div;
        }

        async function sendQuery() {
            const input = document.getElementById('query-input');
            const query = input.value.trim();
            if (!query) return;

            // sanitize output
            const safe = query.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            addMessage(safe, 'user');
            input.value = '';
            lastQuery = query;

            const loadingDiv = addMessage('<span class="spinner"></span> Thinking...', 'bot');

            try {
                const res = await fetch('/query', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ query, session_id: currentSessionId })
                });
                const data = await res.json();
                lastAnswer = data.answer;

                const safeAnswer = data.answer.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                loadingDiv.innerHTML = `
        ${safeAnswer}
        <div class="confidence">Confidence: ${data.confidence} ${data.escalated ? '· Auto-escalated ✓' : ''}</div>
        <div class="btn-row">
          <button id="escalate-btn" onclick="escalate()">🙋 Escalate to Human</button>
        </div>
      `;

                if (data.escalated) startPolling();

            } catch (e) {
                loadingDiv.textContent = 'Error. Try again.';
            }
        }

        async function escalate() {
            document.getElementById('escalate-btn').disabled = true;
            document.getElementById('escalate-btn').textContent = 'Escalated ✓';
            await fetch('/escalate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ query: lastQuery, session_id: currentSessionId })
            });
            addStatus('⏳ Your query is in queue. A human agent will review it. Checking every 5s...');
            startPolling();
        }

        function startPolling() {
            if (pollingInterval) return;
            pollingInterval = setInterval(async () => {
                const res = await fetch(`/queue-status/${currentSessionId}`);
                const data = await res.json();
                if (!data.in_queue && data.answer) {
                    clearInterval(pollingInterval);
                    pollingInterval = null;
                    const safeAns = data.answer.replace(/</g, '&lt;').replace(/>/g, '&gt;');
                    addStatus(`✅ Resolved by human agent: ${safeAns}`, 'resolved-msg');
                    document.getElementById('ask-again-btn').style.display = 'inline-block';
                }
            }, 5000);
        }

        document.getElementById('query-input').addEventListener('keydown', e => {
            if (e.key === 'Enter') sendQuery();
        });
    </script>

</body>

</html>
